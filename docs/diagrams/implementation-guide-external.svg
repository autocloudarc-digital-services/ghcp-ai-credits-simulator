<svg id="implementation-guide-external" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 2000 2450" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="chart-title-external chart-desc-external">
  <title id="chart-title-external">Provider-neutral AI consumption governance flow</title>
  <desc id="chart-desc-external">A large-print seven-step customer workflow showing owned scope, authoritative evidence, completeness decisions, four configurable governance layers, validation, approval, pilot, staged rollout, monitoring, escalation, reconciliation, exceptions, rollback, redesign, and recurring review.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .header { fill: #173c4d; }
      .header-title { fill: #ffffff; font: 700 38px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; letter-spacing: 0; }
      .header-subtitle { fill: #d9edf1; font: 400 25px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .band { fill: #f8fbfd; stroke: #9bb3c4; stroke-width: 3; }
      .band-alt { fill: #f4f9f7; stroke: #9bb3c4; stroke-width: 3; }
      .number { fill: #1f7180; }
      .number-text { fill: #ffffff; font: 700 42px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; text-anchor: middle; }
      .band-title { fill: #173c4d; font: 700 34px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .small { fill: #43576a; font: 400 23px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .evidence { fill: #e7f1fb; stroke: #4d8fbd; stroke-width: 3; }
      .control { fill: #e6f4ed; stroke: #4f9b73; stroke-width: 3; }
      .exposure { fill: #fff0dc; stroke: #d48436; stroke-width: 3; }
      .approval { fill: #eee8fa; stroke: #8067af; stroke-width: 3; }
      .monitor { fill: #e2f3f2; stroke: #3d9794; stroke-width: 3; }
      .stop { fill: #fde8e7; stroke: #c55350; stroke-width: 3; }
      .card-title { fill: #173c4d; font: 700 26px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .card-text { fill: #172033; font: 400 24px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .arrow { stroke: #526176; stroke-width: 5; fill: none; }
      .footer { fill: #43576a; font: 400 22px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
    </style>
    <marker id="arrow-external" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#526176" />
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="2000" height="2450" />
  <rect class="header" x="70" y="55" width="1860" height="135" rx="22" />
  <text class="header-title" x="115" y="115">Provider-neutral AI consumption governance</text>
  <text class="header-subtitle" x="115" y="157">Customer-owned route: scope -&gt; evidence -&gt; configurable controls -&gt; approval -&gt; pilot -&gt; operation</text>

  <g aria-label="Legend">
    <rect class="evidence" x="1170" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1210" y="105">evidence</text>
    <rect class="control" x="1330" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1370" y="105">control</text>
    <rect class="approval" x="1470" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1510" y="105">approval</text>
    <rect class="monitor" x="1640" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1680" y="105">monitoring</text>
  </g>

  <line class="arrow" x1="1000" y1="500" x2="1000" y2="525" marker-end="url(#arrow-external)" />
  <line class="arrow" x1="1000" y1="820" x2="1000" y2="845" marker-end="url(#arrow-external)" />
  <line class="arrow" x1="1000" y1="1165" x2="1000" y2="1190" marker-end="url(#arrow-external)" />
  <line class="arrow" x1="1000" y1="1510" x2="1000" y2="1535" marker-end="url(#arrow-external)" />
  <line class="arrow" x1="1000" y1="1855" x2="1000" y2="1880" marker-end="url(#arrow-external)" />
  <line class="arrow" x1="1000" y1="2155" x2="1000" y2="2180" marker-end="url(#arrow-external)" />

  <g id="external-step-1">
    <rect class="band" x="70" y="225" width="1860" height="275" rx="20" />
    <rect class="number" x="95" y="250" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="320">1</text>
    <text class="band-title" x="235" y="292">Define scope, authority, and decision ownership</text>
    <rect class="evidence" x="235" y="335" width="510" height="125" rx="15" />
    <text class="card-title" x="265" y="375">Define the decision</text>
    <text class="card-text" x="265" y="411">Account, service, population, period,</text>
    <text class="card-text" x="265" y="442">and exclusions.</text>
    <rect class="approval" x="775" y="335" width="510" height="125" rx="15" />
    <text class="card-title" x="805" y="375">Name accountable owners</text>
    <text class="card-text" x="805" y="411">Budget, service, security, license,</text>
    <text class="card-text" x="805" y="442">business, and operating owners.</text>
    <rect class="control" x="1315" y="335" width="570" height="125" rx="15" />
    <text class="card-title" x="1345" y="375">Set decision rights</text>
    <text class="card-text" x="1345" y="411">Evidence handling, change, exception,</text>
    <text class="card-text" x="1345" y="442">rollback, and escalation paths.</text>
  </g>

  <g id="external-step-2">
    <rect class="band-alt" x="70" y="545" width="1860" height="275" rx="20" />
    <rect class="number" x="95" y="570" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="640">2</text>
    <text class="band-title" x="235" y="612">Register evidence and establish the baseline</text>
    <rect class="evidence" x="235" y="655" width="500" height="125" rx="15" />
    <text class="card-title" x="265" y="695">Authoritative provider evidence</text>
    <text class="card-text" x="265" y="731">Consumption, entitlement, capability,</text>
    <text class="card-text" x="265" y="762">and configured state.</text>
    <rect class="evidence" x="765" y="655" width="530" height="125" rx="15" />
    <text class="card-title" x="795" y="695">Source register</text>
    <text class="card-text" x="795" y="731">Owner, scope, retrieval time,</text>
    <text class="card-text" x="795" y="762">authorization, condition, limitations.</text>
    <rect class="exposure" x="1326" y="655" width="559" height="125" rx="15" />
    <text class="card-title" x="1356" y="695">Customer and finance evidence</text>
    <text class="card-text" x="1356" y="731">Funding, inventory, assignments,</text>
    <text class="card-text" x="1356" y="762">need, risk, and scoped variances.</text>
  </g>

  <g id="external-step-3">
    <rect class="band" x="70" y="865" width="1860" height="300" rx="20" />
    <rect class="number" x="95" y="890" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="960">3</text>
    <text class="band-title" x="235" y="932">Decide whether evidence is complete enough</text>
    <rect class="approval" x="235" y="975" width="520" height="145" rx="15" />
    <text class="card-title" x="265" y="1015">Decision gate</text>
    <text class="card-text" x="265" y="1051">Complete enough for the</text>
    <text class="card-text" x="265" y="1082">decision and approval?</text>
    <rect class="control" x="785" y="975" width="520" height="145" rx="15" />
    <text class="card-title" x="815" y="1015">Continue</text>
    <text class="card-text" x="815" y="1051">Reconcile the scoped baseline</text>
    <text class="card-text" x="815" y="1082">and preserve warnings.</text>
    <rect class="stop" x="1335" y="975" width="550" height="145" rx="15" />
    <text class="card-title" x="1365" y="1015">No: resolve or limit</text>
    <text class="card-text" x="1365" y="1051">Record Unknown, gap owner,</text>
    <text class="card-text" x="1365" y="1082">impact, approver, or defer.</text>
  </g>

  <g id="external-step-4">
    <rect class="band-alt" x="70" y="1210" width="1860" height="300" rx="20" />
    <rect class="number" x="95" y="1235" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="1305">4</text>
    <text class="band-title" x="235" y="1277">Design four separate configurable layers</text>
    <rect class="exposure" x="235" y="1320" width="520" height="145" rx="15" />
    <text class="card-title" x="265" y="1360">Enterprise guardrail</text>
    <text class="card-text" x="265" y="1396">Financial backstop for</text>
    <text class="card-text" x="265" y="1427">aggregate metered exposure.</text>
    <rect class="exposure" x="785" y="1320" width="520" height="145" rx="15" />
    <text class="card-title" x="815" y="1360">Per-user controls</text>
    <text class="card-text" x="815" y="1396">Universal baseline plus</text>
    <text class="card-text" x="815" y="1427">approved cohort overrides.</text>
    <rect class="approval" x="1335" y="1320" width="550" height="145" rx="15" />
    <text class="card-title" x="1365" y="1360">Access-policy archetype</text>
    <text class="card-text" x="1365" y="1396">Separate access posture from</text>
    <text class="card-text" x="1365" y="1427">financial controls and limits.</text>
    <text class="small" x="235" y="1492">Controlled profile register: scope, assignment, owner, evidence, response, duration, and review date.</text>
  </g>

  <g id="external-step-5">
    <rect class="band" x="70" y="1555" width="1860" height="300" rx="20" />
    <rect class="number" x="95" y="1580" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="1650">5</text>
    <text class="band-title" x="235" y="1622">Validate behavior, design, and approval</text>
    <rect class="control" x="235" y="1665" width="690" height="145" rx="15" />
    <text class="card-title" x="265" y="1705">Validate with documentation and tests</text>
    <text class="card-text" x="265" y="1741">Rates, capability, scope, overlap,</text>
    <text class="card-text" x="265" y="1772">precedence, alerts, and enforcement.</text>
    <rect class="approval" x="955" y="1665" width="450" height="145" rx="15" />
    <text class="card-title" x="985" y="1705">Owners approve?</text>
    <text class="card-text" x="985" y="1741">Yes: approve limited pilot.</text>
    <text class="card-text" x="985" y="1772">No: revise or defer.</text>
    <rect class="stop" x="1435" y="1665" width="450" height="145" rx="15" />
    <text class="card-title" x="1465" y="1705">Alerts are signals</text>
    <text class="card-text" x="1465" y="1741">They do not by themselves</text>
    <text class="card-text" x="1465" y="1772">block usage or approve change.</text>
  </g>

  <g id="external-step-6">
    <rect class="band-alt" x="70" y="1900" width="1860" height="260" rx="20" />
    <rect class="number" x="95" y="1925" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="1995">6</text>
    <text class="band-title" x="235" y="1967">Pilot, stage rollout, and operate</text>
    <rect class="approval" x="235" y="2010" width="520" height="115" rx="15" />
    <text class="card-title" x="265" y="2050">Limited pilot</text>
    <text class="card-text" x="265" y="2086">Prior state, measures, support, rollback.</text>
    <rect class="control" x="785" y="2010" width="520" height="115" rx="15" />
    <text class="card-title" x="815" y="2050">Stage rollout waves</text>
    <text class="card-text" x="815" y="2086">Verify each approved assignment.</text>
    <rect class="monitor" x="1335" y="2010" width="550" height="115" rx="15" />
    <text class="card-title" x="1365" y="2050">Operate verified state</text>
    <text class="card-text" x="1365" y="2086">Maintain records and support users.</text>
  </g>

  <g id="external-step-7">
    <rect class="band" x="70" y="2180" width="1860" height="230" rx="20" />
    <rect class="number" x="95" y="2205" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="2275">7</text>
    <text class="band-title" x="235" y="2247">Monitor, respond, reconcile, and improve</text>
    <rect class="monitor" x="235" y="2290" width="720" height="90" rx="15" />
    <text class="card-text" x="265" y="2345">Consumption, cost, assignment, access posture, drift</text>
    <rect class="approval" x="985" y="2290" width="420" height="90" rx="15" />
    <text class="card-text" x="1015" y="2345">Early warning: refresh and notify.</text>
    <rect class="stop" x="1435" y="2290" width="450" height="90" rx="15" />
    <text class="card-text" x="1465" y="2345">Critical or limit: escalate, contain, roll back.</text>
  </g>

  <text class="footer" x="70" y="2440">Customer-owned governance: verify provider behavior, preserve evidence, and repeat review when conditions change.</text>
</svg>

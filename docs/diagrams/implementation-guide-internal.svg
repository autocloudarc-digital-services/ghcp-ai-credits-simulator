<svg id="implementation-guide-internal" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 2000 2450" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="chart-title-internal chart-desc-internal">
  <title id="chart-title-internal">Internal AI Credits governance implementation flow</title>
  <desc id="chart-desc-internal">A large-print seven-step workflow for the repository application. It covers read-only evidence intake, validation, application calculations, advisory profile proposals, owner approval, manual provider configuration, pilot, rollout, monitoring, exceptions, rollback, and reassessment.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .header { fill: #132238; }
      .header-title { fill: #ffffff; font: 700 38px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; letter-spacing: 0; }
      .header-subtitle { fill: #d8e6f2; font: 400 25px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .band { fill: #f8fbfd; stroke: #9bb3c4; stroke-width: 3; }
      .band-alt { fill: #f4f9f7; stroke: #9bb3c4; stroke-width: 3; }
      .number { fill: #1d5d8f; }
      .number-text { fill: #ffffff; font: 700 42px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; text-anchor: middle; }
      .band-title { fill: #132238; font: 700 34px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .body { fill: #172033; font: 400 27px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .body-bold { fill: #172033; font: 700 27px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .small { fill: #43576a; font: 400 23px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .card { fill: #ffffff; stroke: #b8cbd6; stroke-width: 2; }
      .evidence { fill: #e7f1fb; stroke: #4d8fbd; stroke-width: 3; }
      .control { fill: #e6f4ed; stroke: #4f9b73; stroke-width: 3; }
      .cost { fill: #fff0dc; stroke: #d48436; stroke-width: 3; }
      .approval { fill: #eee8fa; stroke: #8067af; stroke-width: 3; }
      .monitor { fill: #e2f3f2; stroke: #3d9794; stroke-width: 3; }
      .stop { fill: #fde8e7; stroke: #c55350; stroke-width: 3; }
      .card-title { fill: #132238; font: 700 26px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .card-text { fill: #172033; font: 400 24px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
      .arrow { stroke: #526176; stroke-width: 5; fill: none; }
      .footer { fill: #43576a; font: 400 22px 'Atkinson Hyperlegible', 'DejaVu Sans', sans-serif; }
    </style>
    <marker id="arrow-internal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#526176" />
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="2000" height="2450" />
  <rect class="header" x="70" y="55" width="1860" height="135" rx="22" />
  <text class="header-title" x="115" y="115">Internal AI Credits governance implementation</text>
  <text class="header-subtitle" x="115" y="157">Repository application route: evidence -&gt; calculation -&gt; approval -&gt; manual change -&gt; controlled operation</text>

  <g aria-label="Legend">
    <rect class="evidence" x="1210" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1250" y="105">evidence</text>
    <rect class="control" x="1370" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1410" y="105">control</text>
    <rect class="approval" x="1510" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1550" y="105">approval</text>
    <rect class="monitor" x="1680" y="83" width="28" height="28" rx="5" />
    <text class="small" x="1720" y="105">monitoring</text>
  </g>

  <line class="arrow" x1="1000" y1="500" x2="1000" y2="525" marker-end="url(#arrow-internal)" />
  <line class="arrow" x1="1000" y1="820" x2="1000" y2="845" marker-end="url(#arrow-internal)" />
  <line class="arrow" x1="1000" y1="1165" x2="1000" y2="1190" marker-end="url(#arrow-internal)" />
  <line class="arrow" x1="1000" y1="1510" x2="1000" y2="1535" marker-end="url(#arrow-internal)" />
  <line class="arrow" x1="1000" y1="1855" x2="1000" y2="1880" marker-end="url(#arrow-internal)" />
  <line class="arrow" x1="1000" y1="2155" x2="1000" y2="2180" marker-end="url(#arrow-internal)" />

  <g id="internal-step-1">
    <rect class="band" x="70" y="225" width="1860" height="275" rx="20" />
    <rect class="number" x="95" y="250" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="320">1</text>
    <text class="band-title" x="235" y="292">Scope and read-only evidence intake</text>
    <rect class="evidence" x="235" y="335" width="510" height="125" rx="15" />
    <text class="card-title" x="265" y="375">Define the assessment</text>
    <text class="card-text" x="265" y="411">Scope, period, populations, owners</text>
    <text class="card-text" x="265" y="442">and approved evidence location.</text>
    <rect class="evidence" x="775" y="335" width="510" height="125" rx="15" />
    <text class="card-title" x="805" y="375">Read permitted sources</text>
    <text class="card-text" x="805" y="411">Usage, licenses, governance records,</text>
    <text class="card-text" x="805" y="442">organizations, teams, and users.</text>
    <rect class="evidence" x="1315" y="335" width="570" height="125" rx="15" />
    <text class="card-title" x="1345" y="375">Preserve provenance</text>
    <text class="card-text" x="1345" y="411">Permissions, scope, retrieval time,</text>
    <text class="card-text" x="1345" y="442">warnings, and unknown values.</text>
  </g>

  <g id="internal-step-2">
    <rect class="band-alt" x="70" y="545" width="1860" height="275" rx="20" />
    <rect class="number" x="95" y="570" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="640">2</text>
    <text class="band-title" x="235" y="612">Validate source authority and completeness</text>
    <rect class="approval" x="235" y="655" width="500" height="125" rx="15" />
    <text class="card-title" x="265" y="695">Decision gate</text>
    <text class="card-text" x="265" y="731">Is the evidence complete and</text>
    <text class="card-text" x="265" y="762">authorized for this decision?</text>
    <rect class="control" x="765" y="655" width="530" height="125" rx="15" />
    <text class="card-title" x="795" y="695">Continue</text>
    <text class="card-text" x="795" y="731">Reconcile the approved scope</text>
    <text class="card-text" x="795" y="762">and pass evidence to the route.</text>
    <rect class="stop" x="1326" y="655" width="559" height="125" rx="15" />
    <text class="card-title" x="1356" y="695">No: resolve or limit</text>
    <text class="card-text" x="1356" y="731">Retain Unknown, assign an owner,</text>
    <text class="card-text" x="1356" y="762">or block approval until resolved.</text>
  </g>

  <g id="internal-step-3">
    <rect class="band" x="70" y="865" width="1860" height="300" rx="20" />
    <rect class="number" x="95" y="890" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="960">3</text>
    <text class="band-title" x="235" y="932">Run the application workflow and preserve rate basis</text>
    <rect class="cost" x="235" y="975" width="520" height="145" rx="15" />
    <text class="card-title" x="265" y="1015">Application route</text>
    <text class="card-text" x="265" y="1051">Assessment -&gt; Simulator -&gt;</text>
    <text class="card-text" x="265" y="1082">Insights -&gt; Recommendations -&gt; Report</text>
    <rect class="cost" x="785" y="975" width="520" height="145" rx="15" />
    <text class="card-title" x="815" y="1015">Labeled outputs</text>
    <text class="card-text" x="815" y="1051">Pool, burn, exhaustion, overage,</text>
    <text class="card-text" x="815" y="1082">trends, and advisory signals.</text>
    <rect class="approval" x="1335" y="975" width="550" height="145" rx="15" />
    <text class="card-title" x="1365" y="1015">Reconcile basis</text>
    <text class="card-text" x="1365" y="1051">Assessment promotional rates vs.</text>
    <text class="card-text" x="1365" y="1082">simulator standard rates. Record both.</text>
  </g>

  <g id="internal-step-4">
    <rect class="band-alt" x="70" y="1210" width="1860" height="300" rx="20" />
    <rect class="number" x="95" y="1235" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="1305">4</text>
    <text class="band-title" x="235" y="1277">Separate financial controls from access-policy proposals</text>
    <rect class="cost" x="235" y="1320" width="820" height="145" rx="15" />
    <text class="card-title" x="265" y="1360">Financial control proposals</text>
    <text class="card-text" x="265" y="1396">Enterprise spending limit</text>
    <text class="card-text" x="265" y="1427">Universal ULB + higher-usage cohort overrides</text>
    <rect class="approval" x="1085" y="1320" width="800" height="145" rx="15" />
    <text class="card-title" x="1115" y="1360">Access-policy proposals</text>
    <text class="card-text" x="1115" y="1396">Organization profiles are planning examples,</text>
    <text class="card-text" x="1115" y="1427">not budgets or current provider policy state.</text>
    <rect class="card" x="235" y="1475" width="1650" height="20" rx="10" />
    <text class="small" x="265" y="1492">Versioned proposal register: evidence, owners, assignments, approvals, review dates, and rate basis.</text>
  </g>

  <g id="internal-step-5">
    <rect class="band" x="70" y="1555" width="1860" height="300" rx="20" />
    <rect class="number" x="95" y="1580" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="1650">5</text>
    <text class="band-title" x="235" y="1622">Reconcile, approve, and preserve the hard boundary</text>
    <rect class="control" x="235" y="1665" width="690" height="145" rx="15" />
    <text class="card-title" x="265" y="1705">Reconcile before approval</text>
    <text class="card-text" x="265" y="1741">Sources, rate basis, calculations,</text>
    <text class="card-text" x="265" y="1772">assignments, and variances.</text>
    <rect class="approval" x="955" y="1665" width="450" height="145" rx="15" />
    <text class="card-title" x="985" y="1705">Owners approve?</text>
    <text class="card-text" x="985" y="1741">Yes: authorize change.</text>
    <text class="card-text" x="985" y="1772">No: revise or defer.</text>
    <rect class="stop" x="1435" y="1665" width="450" height="145" rx="15" />
    <text class="card-title" x="1465" y="1705">Manual boundary</text>
    <text class="card-text" x="1465" y="1741">An authorized administrator</text>
    <text class="card-text" x="1465" y="1772">configures the provider.</text>
  </g>

  <g id="internal-step-6">
    <rect class="band-alt" x="70" y="1900" width="1860" height="260" rx="20" />
    <rect class="number" x="95" y="1925" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="1995">6</text>
    <text class="band-title" x="235" y="1967">Verify, pilot, and stage the rollout</text>
    <rect class="control" x="235" y="2010" width="520" height="115" rx="15" />
    <text class="card-title" x="265" y="2050">Independent verification</text>
    <text class="card-text" x="265" y="2086">Scope, precedence, alerts, enforcement.</text>
    <rect class="approval" x="785" y="2010" width="520" height="115" rx="15" />
    <text class="card-title" x="815" y="2050">Limited pilot</text>
    <text class="card-text" x="815" y="2086">Approved success and rollback criteria.</text>
    <rect class="monitor" x="1335" y="2010" width="550" height="115" rx="15" />
    <text class="card-title" x="1365" y="2050">Stage and operate</text>
    <text class="card-text" x="1365" y="2086">Verify each wave and register evidence.</text>
  </g>

  <g id="internal-step-7">
    <rect class="band" x="70" y="2180" width="1860" height="230" rx="20" />
    <rect class="number" x="95" y="2205" width="110" height="110" rx="18" />
    <text class="number-text" x="150" y="2275">7</text>
    <text class="band-title" x="235" y="2247">Monitor, control exceptions, and reassess</text>
    <rect class="monitor" x="235" y="2290" width="720" height="90" rx="15" />
    <text class="card-text" x="265" y="2345">Usage, cost exposure, alerts, assignments, and drift</text>
    <rect class="stop" x="985" y="2290" width="420" height="90" rx="15" />
    <text class="card-text" x="1015" y="2345">Exception? Roll back or contain.</text>
    <rect class="control" x="1435" y="2290" width="450" height="90" rx="15" />
    <text class="card-text" x="1465" y="2345">Reconcile, reassess, and redesign.</text>
  </g>

  <text class="footer" x="70" y="2440">Application role: assess, simulate, recommend, and report. It never mutates provider governance resources.</text>
</svg>

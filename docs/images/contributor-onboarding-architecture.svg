  <g transform="translate(1382,548)">
    <rect class="warning-panel" width="174" height="204" rx="10" />
    <text x="87" y="29" class="label center">Security path</text>
    <line x1="18" y1="42" x2="156" y2="42" class="divider" />
    <circle cx="30" cy="68" r="5" fill="#d97706" /><text x="44" y="73" class="body">OAuth state</text>
    <circle cx="30" cy="96" r="5" fill="#d97706" /><text x="44" y="101" class="body">AES-256-GCM</text>
    <circle cx="30" cy="124" r="5" fill="#d97706" /><text x="44" y="129" class="body">HTTP-only cookie</text>
    <circle cx="30" cy="152" r="5" fill="#d97706" /><text x="44" y="157" class="body">CSRF token</text>
    <circle cx="30" cy="180" r="5" fill="#d97706" /><text x="44" y="185" class="body">Rate limiting</text>
  </g>

  <text x="44" y="804" class="section">3. Follow the gated user journey, then contribute at the owning layer</text>
  <text x="44" y="827" class="body">Every user completes an OAuth-backed assessment before simulation, governance insight, recommendations, and reporting unlock.</text>

  <g transform="translate(44,852)">

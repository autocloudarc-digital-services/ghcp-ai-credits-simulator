    <rect x="0" y="0" width="232" height="224" rx="10" fill="#f1f5f9" />
    <text x="24" y="34" class="label">Complete in order</text>
    <text x="24" y="62" class="body">Each completed operation</text>
    <text x="24" y="82" class="body">unlocks the next step.</text>
    <text x="24" y="114" class="body">Refresh restores progress</text>
    <text x="24" y="134" class="body">after session validation.</text>
    <rect x="24" y="164" width="178" height="36" rx="18" fill="#0f172a" />
    <text x="113" y="187" class="label center" style="fill:#ffffff">localhost:5173</text>

    <rect x="270" y="52" width="190" height="118" rx="8" class="server-panel" />

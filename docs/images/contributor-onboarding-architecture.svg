    <text x="570" y="52" class="small" style="fill:#cbd5e1">State: client/src/store</text>
    <text x="805" y="52" class="small" style="fill:#cbd5e1">API: server/src/routes</text>
    <text x="1050" y="52" class="small" style="fill:#cbd5e1">Integrations: server/src/services</text>
    <text x="1338" y="52" class="small" style="fill:#cbd5e1">Contracts: shared/</text>
  </g>
</svg>
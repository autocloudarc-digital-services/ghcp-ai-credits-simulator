    <text x="361" y="96" class="label center">Five route pages</text>
    <text x="361" y="120" class="body center">Assessment | Simulator | Governance Insights</text>
    <text x="361" y="138" class="body center">Recommendations | Executive Report</text>

    <rect x="20" y="170" width="152" height="76" rx="8" class="node-client" />
    <text x="96" y="197" class="label center">Zustand store</text>
    <text x="96" y="220" class="small center">Session autosave + gates</text>
    <text x="96" y="237" class="code center">store/appStore.ts</text>

    <rect x="194" y="170" width="152" height="76" rx="8" class="node-client" />
    <text x="270" y="197" class="label center">Credit engine</text>
    <text x="270" y="220" class="small center">Pools, burn, overage</text>
    <text x="270" y="237" class="code center">engine/...</text>

    <rect x="368" y="170" width="160" height="76" rx="8" class="node-client" />
    <text x="448" y="197" class="label center">Visual outputs</text>
    <text x="448" y="220" class="small center">Charts + 3D + 2D</text>
    <text x="448" y="237" class="code center">components/...</text>


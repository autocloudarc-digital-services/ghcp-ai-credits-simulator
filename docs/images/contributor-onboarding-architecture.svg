    <text x="386" y="32" class="small" style="fill:#dbeafe">server/ | 3001</text>

    <rect x="20" y="72" width="460" height="54" rx="8" fill="#dbeafe" stroke="#60a5fa" />
    <text x="250" y="95" class="label center">Request security gateway</text>
    <text x="250" y="115" class="small center">CORS | session cookie | CSRF | rate limits | auth middleware</text>

    <rect x="20" y="148" width="138" height="96" rx="8" class="node-server" />
    <text x="89" y="175" class="label center">Auth routes</text>
    <text x="89" y="197" class="small center">OAuth + status</text>
    <text x="89" y="216" class="small center">logout + revoke</text>
    <text x="89" y="235" class="code center">routes/auth.ts</text>

    <rect x="181" y="148" width="138" height="96" rx="8" class="node-server" />
    <text x="250" y="175" class="label center">Assessment</text>
    <text x="250" y="197" class="small center">Owned async jobs</text>
    <text x="250" y="216" class="small center">Usage + governance</text>
    <text x="250" y="235" class="code center">routes/assessment.ts</text>

    <rect x="342" y="148" width="138" height="96" rx="8" class="node-server" />
    <text x="411" y="175" class="label center">Reports</text>
    <text x="411" y="197" class="small center">Assessment-gated PDF</text>
    <text x="411" y="216" class="small center">Owner-only download</text>
    <text x="411" y="235" class="code center">routes/report.ts</text>


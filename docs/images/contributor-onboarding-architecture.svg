    <path d="M172 208 H190" class="arrow-teal" />
    <path d="M346 208 H364" class="arrow-teal" />

    <rect x="20" y="272" width="508" height="58" rx="8" fill="#ccfbf1" stroke="#5eead4" />
    <text x="274" y="296" class="label center">Client infrastructure</text>
    <text x="274" y="317" class="body center">Axios + CSRF interceptor | React Hook Form + Zod | Tailwind CSS</text>
  </g>

  <path d="M808 462 H842" class="arrow-blue" />
  <text x="825" y="432" class="small center">/api</text>
  <text x="825" y="448" class="small center">/auth</text>

  <g transform="translate(846,398)">

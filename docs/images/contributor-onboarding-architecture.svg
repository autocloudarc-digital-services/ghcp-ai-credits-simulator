    <text x="250" y="294" class="label center">Process-local memory</text>
    <text x="250" y="316" class="body center">Sessions | assessment jobs | generated PDF buffers</text>
  </g>

  <path d="M1348 461 H1378" class="arrow" />
  <g transform="translate(1382,398)">

    <text x="837" y="104" class="body center">Readiness score</text>
    <text x="837" y="124" class="body center">Concentration risk</text>
    <text x="837" y="144" class="body center">Governance gaps</text>
    <path d="M934 111 H974" class="arrow-green" />

    <rect x="978" y="52" width="190" height="118" rx="8" class="success-panel" />

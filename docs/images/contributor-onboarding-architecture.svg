<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Copilot AI Credits Simulator contributor onboarding and architecture</title>
  <desc id="desc">A visual guide showing five setup steps, the React client and Express server architecture, GitHub integrations, security controls, session state, contributor file landmarks, and the mandatory assessment-first workflow.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .client-panel { fill: #ecfeff; stroke: #0f766e; stroke-width: 3; }
      .server-panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .shared-panel { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .github-panel { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .memory-panel { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .success-panel { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .warning-panel { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .node-client { fill: #ffffff; stroke: #14b8a6; stroke-width: 2; }
      .node-server { fill: #ffffff; stroke: #60a5fa; stroke-width: 2; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .section-light { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .code { font: 600 13px Consolas, 'Courier New', monospace; fill: #0f172a; }
      .step-number { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .center { text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-teal { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow-teal); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #16a34a; stroke-width: 3; marker-end: url(#arrow-green); }
      .arrow-dashed { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-purple); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
      .pill { fill: #e2e8f0; }
      .pill-text { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #334155; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1200" />
  <rect x="0" y="0" width="1600" height="108" fill="#0f172a" />
  <circle cx="64" cy="54" r="28" fill="#14b8a6" />
  <path d="M50 55 L61 66 L80 41" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="110" y="48" class="section-light" style="font-size:30px">GitHub Copilot AI Credits Simulator</text>
  <text x="110" y="77" class="subtitle" style="fill:#cbd5e1">Contributor onboarding, runtime architecture, and feature flow</text>
  <rect x="1275" y="27" width="270" height="54" rx="8" fill="#1e293b" stroke="#475569" />
  <text x="1410" y="49" class="small center" style="fill:#94a3b8">START HERE</text>
  <text x="1410" y="70" class="label center" style="fill:#ffffff">npm workspace | Node.js LTS</text>

  <text x="44" y="145" class="section">1. Get from repository to running app</text>
  <text x="44" y="168" class="body">Codespaces is the preferred path when local security or package proxies block npm.</text>

  <g transform="translate(44,190)">
    <rect class="panel" width="272" height="112" rx="8" />
    <circle cx="28" cy="28" r="18" fill="#2563eb" /><text x="28" y="29" class="step-number">1</text>
    <text x="56" y="29" class="label">Open the workspace</text>
    <text x="20" y="61" class="body">Fork or clone, then choose:</text>
    <rect x="20" y="75" width="105" height="24" rx="12" class="pill" /><text x="72" y="91" class="pill-text">Codespaces</text>
    <rect x="133" y="75" width="118" height="24" rx="12" class="pill" /><text x="192" y="91" class="pill-text">Local VS Code</text>
  </g>
  <path d="M320 246 H344" class="arrow" />
  <g transform="translate(348,190)">
    <rect class="panel" width="272" height="112" rx="8" />
    <circle cx="28" cy="28" r="18" fill="#2563eb" /><text x="28" y="29" class="step-number">2</text>
    <text x="56" y="29" class="label">Install dependencies</text>
    <text x="20" y="63" class="code">node --version</text>
    <text x="20" y="87" class="code">npm install</text>
  </g>
  <path d="M624 246 H648" class="arrow" />
  <g transform="translate(652,190)">
    <rect class="panel" width="272" height="112" rx="8" />
    <circle cx="28" cy="28" r="18" fill="#7c3aed" /><text x="28" y="29" class="step-number">3</text>
    <text x="56" y="29" class="label">Configure OAuth</text>
    <text x="20" y="61" class="body">Add app credentials + secret</text>
    <text x="20" y="86" class="body">Assessment is the entry point</text>
  </g>
  <path d="M928 246 H952" class="arrow" />
  <g transform="translate(956,190)">
    <rect class="panel" width="272" height="112" rx="8" />
    <circle cx="28" cy="28" r="18" fill="#0f766e" /><text x="28" y="29" class="step-number">4</text>
    <text x="56" y="29" class="label">Start both services</text>
    <text x="20" y="63" class="code">npm run dev</text>
    <text x="20" y="88" class="body">Vite 5173 + Express 3001</text>
  </g>
  <path d="M1232 246 H1256" class="arrow" />
  <g transform="translate(1260,190)">
    <rect class="success-panel" width="296" height="112" rx="8" />
    <circle cx="28" cy="28" r="18" fill="#16a34a" /><text x="28" y="29" class="step-number">5</text>
    <text x="56" y="29" class="label">Verify and build</text>
    <text x="20" y="61" class="code">GET /healthz -> {status: ok}</text>
    <text x="20" y="87" class="code">npm run build</text>
  </g>

  <text x="44" y="348" class="section">2. Understand the runtime before changing code</text>
  <text x="44" y="371" class="body">The browser talks to one development origin. Vite proxies API and authentication traffic to Express.</text>

  <g transform="translate(44,398)">
    <rect class="github-panel" width="170" height="126" rx="10" />
    <circle cx="85" cy="38" r="22" fill="#334155" />
    <path d="M73 38 H97 M85 26 V50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text x="85" y="77" class="label center">Browser user</text>
    <text x="85" y="99" class="small center">Open port 5173</text>
    <text x="85" y="116" class="small center">One origin in dev</text>
  </g>

  <path d="M216 461 H254" class="arrow-teal" />
  <text x="235" y="447" class="small center">UI</text>

  <g transform="translate(258,398)">
    <rect class="client-panel" width="548" height="354" rx="12" />
    <rect x="0" y="0" width="548" height="52" rx="10" fill="#0f766e" />
    <rect x="0" y="40" width="548" height="12" fill="#0f766e" />
    <text x="22" y="33" class="section-light">React client</text>
    <text x="442" y="32" class="small" style="fill:#ccfbf1">client/ | 5173</text>

    <rect x="20" y="72" width="152" height="74" rx="8" class="node-client" />

      <circle cx="238" cy="179" r="5" />
      <circle cx="259" cy="164" r="5" />
      <circle cx="280" cy="188" r="5" />
      <circle cx="293" cy="132" r="5" />
      <circle cx="329" cy="163" r="5" />
    </g>

    <g filter="url(#softShadow)">
      <circle cx="256" cy="261" r="78" fill="#03152b" stroke="#e8fbff" stroke-width="8" />
      <circle cx="256" cy="261" r="63" fill="url(#token)" stroke="#24e5ff" stroke-width="4" />
      <path d="M219 276L242 230L263 276M227 261H255" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

      <path d="M413 208H426V221" fill="none" stroke="#ffc24b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <path d="M139 393C184 363 224 349 272 344C318 339 361 340 407 325" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95" />
    <path d="M143 407C194 374 238 361 286 357C332 353 371 352 411 337" fill="none" stroke="#17bfff" stroke-width="5" stroke-linecap="round" />

    <g fill="#f7a928">
      <circle cx="215" cy="426" r="4" />
      <circle cx="256" cy="426" r="4" />
      <circle cx="297" cy="426" r="4" />
    </g>
  </g>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#0a274a" stroke-width="8" />

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">GitHub Copilot AI Credits Simulator logo</title>
  <desc id="description">A glowing cloud surrounds an AI credit token, usage bars, and a governance check beneath an amber digital-services arc.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="64%">
      <stop offset="0" stop-color="#0b3158" />
      <stop offset="0.62" stop-color="#061a34" />
      <stop offset="1" stop-color="#020914" />
    </radialGradient>
    <linearGradient id="cyan" x1="92" y1="154" x2="414" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20e6ff" />
      <stop offset="0.5" stop-color="#00a8f4" />
      <stop offset="1" stop-color="#1767df" />
    </linearGradient>
    <linearGradient id="token" x1="206" y1="196" x2="307" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0fe3ff" />
      <stop offset="0.48" stop-color="#078bdc" />
      <stop offset="1" stop-color="#083d92" />
    </linearGradient>
    <linearGradient id="amber" x1="108" y1="70" x2="410" y2="433" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd166" />
      <stop offset="0.48" stop-color="#f6a623" />
      <stop offset="1" stop-color="#ff8a00" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.7" />
    </filter>
    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="248" />
    </clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <rect width="512" height="512" fill="#02060d" />
    <circle cx="256" cy="256" r="244" fill="url(#background)" />
    <path d="M80 235C90 139 160 72 256 64C352 72 422 139 432 235" fill="none" stroke="url(#amber)" stroke-width="9" stroke-linecap="round" />
    <path d="M92 385C127 433 184 462 256 462C328 462 385 433 420 385" fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round" opacity="0.95" />

    <g fill="none" stroke="#18dfff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M135 338C96 338 74 310 74 278C74 247 94 221 123 215C124 171 158 138 201 138C217 104 251 82 291 82C345 82 388 122 393 174C433 176 464 209 464 249C464 288 435 320 397 324" stroke="url(#cyan)" stroke-width="13" />

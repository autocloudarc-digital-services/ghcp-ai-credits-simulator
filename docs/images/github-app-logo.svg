      <circle cx="301" cy="223" r="16" fill="url(#amber)" stroke="#fff4cf" stroke-width="4" />
      <path d="M294 223L299 228L308 217" fill="none" stroke="#082342" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g fill="none" stroke="#13d8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M91 279H132L153 258H180" />
      <path d="M97 309H147L169 287H183" />
      <circle cx="84" cy="279" r="7" fill="#061a34" />
      <circle cx="90" cy="309" r="7" fill="#061a34" />
    </g>

    <g filter="url(#softShadow)">
      <path d="M331 299H363V356H331Z" fill="#0b71d4" stroke="#20deff" stroke-width="4" />

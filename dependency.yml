schema_version: 1
package_manager:
  name: npm
  lockfile: package-lock.json
  lockfile_version: 3
  node: "22"
  transitive_dependencies: package-lock.json

workspaces:
  root:
    manifest: package.json
    development_dependencies:
      concurrently: "^8.2.2"
      js-yaml: "^5.4.1"
    overrides:
      qs: "6.16.0"

  client:
    manifest: client/package.json
    dependencies:
      "@hookform/resolvers": "^3.10.0"
      "@react-three/drei": "^9.115.0"
      "@react-three/fiber": "^8.17.10"
      axios: "^1.7.9"
      framer-motion: "^11.15.0"
      lucide-react: "^0.468.0"
      react: "^18.3.1"
      react-dom: "^18.3.1"
      react-hook-form: "^7.54.1"
      react-router-dom: "^7.18.0"
      recharts: "^2.14.1"
      three: "^0.171.0"
      zod: "^3.24.1"
      zustand: "^5.0.2"
    development_dependencies:
      "@eslint/js": "^9.39.5"
      "@types/react": "^18.3.18"
      "@types/react-dom": "^18.3.5"
      "@types/three": "^0.171.0"
      "@vitejs/plugin-react": "^4.3.4"
      autoprefixer: "^10.4.20"
      eslint: "^9.39.5"
      eslint-plugin-react-hooks: "^5.2.0"
      eslint-plugin-react-refresh: "^0.4.26"
      globals: "^16.5.0"
      postcss: "^8.4.49"
      tailwindcss: "^3.4.17"
      typescript: "^5.7.2"
      typescript-eslint: "^8.70.0"
      vite: "^6.0.5"

  server:
    manifest: server/package.json
    dependencies:
      "@react-pdf/renderer": "^4.1.6"
      axios: "^1.7.9"
      cors: "^2.8.5"
      csv-stringify: "^6.8.3"
      express: "^4.21.2"
      express-rate-limit: "^8.6.1"
      express-session: "^1.18.1"
      jsonwebtoken: "^9.0.3"
      lusca: "^1.7.0"
      react: "^18.3.1"
      zod: "^3.25.76"
    development_dependencies:
      "@types/cors": "^2.8.17"
      "@types/express": "^5.0.0"
      "@types/express-session": "^1.18.0"
      "@types/jsonwebtoken": "^9.0.10"
      "@types/lusca": "^1.7.5"
      "@types/node": "^22.10.5"
      "@types/react": "^18.3.18"
      supertest: "^7.2.2"
      ts-node-dev: "^2.0.0"
      typescript: "^5.7.2"

  shared:
    manifest: shared/package.json
    dependencies: {}
    development_dependencies: {}

services:
  database:
    image: postgres:17-bookworm
  api_gateway:
    image: postgrest/postgrest:v12.2.12
